name: Weekly license refresh
on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 9:00 AM Eastern (13:00 UTC, EDT)
  workflow_dispatch: {}      # also runnable by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update-licenses.mjs
      - name: Commit if changed
        run: |
          git config user.name "license-bot"
          git config user.email "license-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly OCM license refresh" && git push
